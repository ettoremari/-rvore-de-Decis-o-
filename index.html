<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14298F">
<title>Árvore de Decisão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314298F'/%3E%3Cpath d='M9 24v-7M15 24V10M21 24v-5' stroke='%23E9AC3F' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --azul:#14298F; --azul-medio:#3552C9; --azul-claro:#E4E9FA;
  --ouro:#E9AC3F; --ouro-forte:#C98A12; --ouro-claro:#FCEFD3;
  --fundo:#F1F4FB; --papel:#FFFFFF; --tinta:#0F1B4C; --suave:#56608F; --linha:#D3DAF0;
  --erro:#8A3200;
  --dock-h:150px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);
  font:400 17px/1.5 "Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul-medio);outline-offset:2px}
main:focus{outline:none}

/* ---------- topo ---------- */
.topo{position:sticky;top:0;z-index:5;background:rgba(241,244,251,.95);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--linha)}
.topo-in{max-width:560px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.logo-mini{width:44px;height:44px;border-radius:50%;flex:none;display:block;background:#fff}
.identidade{flex:1;min-width:0}
.identidade b{display:block;font-weight:800;font-size:16.5px;line-height:1.15;letter-spacing:-.01em}
.identidade span{display:block;font-size:12px;line-height:1.25;color:var(--suave)}
.barras{display:flex;align-items:flex-end;gap:4px;height:26px;flex:none}
.barras i{display:block;width:8px;border-radius:2px 2px 0 0;background:var(--linha)}
.barras i:nth-child(1){height:10px}
.barras i:nth-child(2){height:15px}
.barras i:nth-child(3){height:20px}
.barras i:nth-child(4){height:26px}
.barras i.feito{background:var(--ouro)}
.barras i.atual{background:var(--azul)}

/* ---------- conteúdo ---------- */
main{max-width:560px;margin:0 auto;padding:22px 16px calc(var(--dock-h) + 28px)}
h1,h2{margin:0}
h1{font-size:clamp(32px,9.5vw,42px);line-height:1.05;letter-spacing:-.03em;font-weight:800}
h1.t-passo{font-size:clamp(27px,7.6vw,32px);line-height:1.1;letter-spacing:-.025em;margin:0 0 8px}
h2{font-size:21px;line-height:1.2;letter-spacing:-.015em;font-weight:800;margin:0 0 10px}
h2.sub{font-size:18px;margin:26px 0 10px}
.etapa{margin:0 0 4px;font-size:14.5px;font-weight:700;color:var(--suave)}
.lead{margin:0 0 16px;color:var(--suave)}
.contador{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--azul);min-height:1.5em}
.nota{margin:8px 0 10px;font-size:14.5px;line-height:1.4;color:var(--suave)}

/* ---------- capa ---------- */
.capa{text-align:center}
.logo-capa{display:block;width:min(56vw,208px);height:auto;aspect-ratio:1;border-radius:50%;margin:6px auto 20px;background:#fff}
.capa .lead{max-width:34ch;margin-left:auto;margin-right:auto}
.fatos{list-style:none;margin:0 0 6px;padding:0;text-align:left}
.fatos li{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.fatos .tique{margin-top:2px}

.origem{display:flex;align-items:center;gap:12px;margin-top:30px;padding-top:16px;border-top:1px solid var(--linha);
  text-align:left;font-size:13.5px;line-height:1.4;color:var(--suave)}
.origem p{margin:0}
.origem b{color:var(--tinta)}
.logo-origem{width:56px;height:56px;border-radius:50%;flex:none;background:#fff}

/* ---------- marcas de seleção ---------- */
.tique{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ouro);display:grid;place-items:center}
.tique svg{width:12px;height:12px}

.pills{display:flex;flex-wrap:wrap;gap:10px}
.pills.col{flex-direction:column}
.pill{appearance:none;-webkit-appearance:none;display:flex;align-items:center;gap:10px;min-height:50px;max-width:100%;
  padding:10px 14px 10px 12px;border:2px solid var(--linha);border-radius:14px;background:var(--papel);
  font-size:16px;line-height:1.25;text-align:left;cursor:pointer}
.pill.larga{width:100%}
.pill .tique{background:transparent;border:2px solid var(--linha)}
.pill .tique svg{opacity:0}
.pill[aria-pressed="true"],.pill[aria-checked="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.pill[aria-pressed="true"] .tique,.pill[aria-checked="true"] .tique{background:var(--ouro);border-color:var(--ouro)}
.pill[aria-pressed="true"] .tique svg,.pill[aria-checked="true"] .tique svg{opacity:1}

/* ---------- escala de 1 a 5 ---------- */
.item{background:var(--papel);border:1px solid var(--linha);border-left:5px solid var(--linha);
  border-radius:16px;padding:14px 14px 12px;margin-bottom:12px}
.item.ok{border-left-color:var(--ouro)}
.item p{margin:0 0 12px;font-weight:600;line-height:1.35}
.escala{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.escala button{appearance:none;-webkit-appearance:none;height:48px;border:2px solid var(--linha);border-radius:12px;
  background:var(--papel);font-weight:800;font-size:18px;color:var(--azul);cursor:pointer}
.escala button[aria-checked="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.pontas{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--suave)}

/* ---------- cálculo ---------- */
.carregando{text-align:center;padding:40px 0}
.gr{display:flex;align-items:flex-end;justify-content:center;gap:9px;height:92px;margin-bottom:24px}
.gr i{display:block;width:18px;height:100%;border-radius:4px 4px 0 0;background:var(--azul);
  transform-origin:bottom;transform:scaleY(.3);animation:cresce .9s ease-in-out infinite alternate}
.gr i:nth-child(even){background:var(--ouro)}
.gr i:nth-child(2){animation-delay:.12s}
.gr i:nth-child(3){animation-delay:.24s}
.gr i:nth-child(4){animation-delay:.36s}
.gr i:nth-child(5){animation-delay:.48s}
@keyframes cresce{to{transform:scaleY(1)}}

/* ---------- resultado ---------- */
.hero{background:var(--azul);color:#fff;border-radius:22px;padding:22px 18px 20px;margin:0 0 16px}
.hero .peq{margin:0 0 6px;font-size:15px;opacity:.9}
.hero h1{color:#fff;margin:0 0 10px;font-size:clamp(30px,8.6vw,38px)}
.hero p{margin:0 0 16px;opacity:.95}
.medidor{height:14px;border-radius:8px;background:rgba(255,255,255,.22);overflow:hidden}
.medidor i{display:block;height:100%;border-radius:8px;background:var(--ouro)}
.medidor-txt{display:flex;justify-content:space-between;margin-top:6px;font-size:14.5px}
.hero .tambem{margin:16px 0 0;font-size:15px}
.aviso{background:var(--ouro-claro);border-left:5px solid var(--ouro);border-radius:10px;padding:12px 14px;margin:0 0 16px;font-size:15.5px}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:20px;padding:18px 16px 14px;margin:0 0 16px}
.cartao > p:last-child{margin-bottom:6px}

.radar{display:block;width:100%;height:auto;margin:4px 0 6px}
.anel{fill:none;stroke:var(--linha);stroke-width:1}
.eixo{stroke:var(--linha);stroke-width:1}
.poly-voce{fill:rgba(233,172,63,.38);stroke:var(--ouro-forte);stroke-width:2.5;stroke-linejoin:round}
.poly-area{fill:none;stroke:var(--azul);stroke-width:2;stroke-dasharray:6 5;stroke-linejoin:round}
.ponto{fill:var(--ouro-forte);stroke:#fff;stroke-width:1.5}
.rot-radar{font-size:13.5px;font-weight:600;fill:var(--tinta)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:0 0 6px}
.legenda span{display:inline-flex;align-items:center;gap:7px}
.chave{display:inline-block;width:16px;height:16px;border-radius:4px}
.chave.voce{background:rgba(233,172,63,.5);border:2px solid var(--ouro-forte)}
.chave.area{border:2px dashed var(--azul)}

details.area{border-top:1px solid var(--linha)}
details.area:first-of-type{border-top:0}
details.area summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:13px 0 12px}
details.area summary::-webkit-details-marker{display:none}
.area-nome{flex:1;min-width:0;font-weight:700;line-height:1.25;display:flex;align-items:center;gap:6px}
.chev{flex:none;color:var(--suave);transition:transform .15s}
details[open] .chev{transform:rotate(180deg)}
.area-pct{font-weight:800}
.area-barra{flex-basis:100%;height:10px;border-radius:6px;background:var(--azul-claro);overflow:hidden}
.area-barra i{display:block;height:100%;border-radius:6px;background:var(--azul-medio)}
details.area.top .area-barra i{background:var(--ouro)}
.area-det{padding:0 0 14px}
.area-det > p:first-child{margin:0 0 4px}
.rot{margin:12px 0 4px;font-size:14px;font-weight:700;color:var(--suave)}
.cursos{display:flex;flex-wrap:wrap;gap:6px}
.curso{color:var(--tinta);background:var(--azul-claro);border-radius:8px;padding:5px 9px;font-size:14.5px;line-height:1.3}
.curso.local{background:var(--ouro);color:var(--tinta);font-weight:700;display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 7px}
.afin{font-size:12.5px;font-weight:700;color:var(--suave);margin-left:6px}
.curso.local .afin{margin-left:0}
.curso.local .afin,.hero .afin{color:var(--tinta)}
.turno{background:var(--tinta);color:#fff;font-size:12px;font-weight:600;border-radius:5px;padding:1px 7px;line-height:1.4}
.selo{flex:none;background:var(--ouro);color:var(--tinta);font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px;line-height:1.4}
.hero-utfpr{margin:18px 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.28)}
.hero .hero-rot{margin:0 0 8px;font-size:14.5px;font-weight:700}
.hero .hero-sem{margin:16px 0 0;font-size:14.5px}

.passos{list-style:none;margin:0 0 6px;padding:0}
.passos li{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.passos .tique{margin-top:2px}

.tipos{margin:6px 0 4px;padding-left:20px}
.tipos li{margin:5px 0;line-height:1.4}
.qr-img{width:min(100%,300px);margin:4px auto 14px;border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:#fff}
.qr-img svg{display:block;width:100%;height:auto}
.qr-cartao > p{margin:0 0 10px}
.qr-texto{margin:0 0 6px}
.qr-texto summary{cursor:pointer;font-weight:700;color:var(--azul);padding:6px 0}
.qr-texto pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;padding:10px 12px;border-radius:10px;
  background:var(--fundo);font:14px/1.45 ui-monospace,Menlo,Consolas,monospace}
.acoes-res{display:flex;flex-direction:column;gap:10px;margin:4px 0 0}
.acoes-res .btn-primario,.acoes-res .btn-sec{width:100%}

/* ---------- botões e dock ---------- */
.btn-primario,.btn-sec{appearance:none;-webkit-appearance:none;height:52px;border-radius:14px;font-weight:800;font-size:17px;cursor:pointer}
.btn-primario{flex:1;border:0;background:var(--ouro);color:var(--tinta)}
.btn-sec{padding:0 20px;border:2px solid var(--linha);background:var(--papel);color:var(--azul)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--papel);
  border-top:1px solid var(--linha);box-shadow:0 -8px 22px rgba(15,27,76,.09)}
.dock-in{max-width:560px;margin:0 auto}
.dock-msg{display:none;margin:0;padding:10px 16px 0;font-size:14.5px;font-weight:700;color:var(--erro)}
.acoes{display:flex;gap:10px;padding:10px 16px 10px}
.faixa{appearance:none;-webkit-appearance:none;display:flex;align-items:center;gap:12px;width:100%;min-height:60px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));border:0;background:var(--azul);color:#fff;text-align:left;cursor:pointer}
.faixa:focus-visible{outline-color:var(--ouro);outline-offset:-4px}
.faixa .ico{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ouro);display:grid;place-items:center}
.faixa strong{display:block;font-size:15px;line-height:1.2;font-weight:800}
.faixa small{display:block;margin-top:2px;font-size:13px;line-height:1.25;opacity:.88}

/* ---------- folha (Ciência de Dados e IA) ---------- */
dialog#folha{width:min(560px,100%);max-width:100%;max-height:90vh;max-height:90dvh;margin:auto auto 0;padding:0;border:0;
  border-radius:22px 22px 0 0;background:var(--papel);color:var(--tinta);overflow:hidden}
dialog#folha[open]{display:flex;flex-direction:column;animation:sobe .22s ease-out}
dialog#folha::backdrop{background:rgba(15,27,76,.6)}
@keyframes sobe{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.folha-topo{display:flex;align-items:center;gap:12px;padding:16px 18px 14px;border-bottom:1px solid var(--linha);flex:none}
.folha-topo .logo-mini{width:48px;height:48px}
.folha-topo p{margin:0;font-size:13.5px;color:var(--suave);line-height:1.25}
.folha-topo h2{font-size:17px;margin:2px 0 0}
.folha-corpo{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 6px}
.folha-corpo h3{margin:0 0 8px;font-size:23px;line-height:1.15;letter-spacing:-.02em;font-weight:800}
.folha-corpo p{margin:0 0 12px}
.folha-pe{flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--linha)}
.folha-pe .btn-primario{width:100%}
.passos-dados{list-style:none;margin:16px 0 0;padding:0;counter-reset:passo}
.passos-dados > li{position:relative;counter-increment:passo;padding:0 0 6px 42px;margin-bottom:8px}
.passos-dados > li::before{content:counter(passo);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;
  background:var(--ouro);color:var(--tinta);font-weight:800;display:grid;place-items:center}
.folha-corpo h4{margin:2px 0 6px;font-size:17.5px;line-height:1.25;font-weight:800;letter-spacing:-.01em}
.termo{background:var(--ouro-claro);border-left:5px solid var(--ouro);border-radius:10px;padding:10px 12px;margin:14px 0;font-size:15.5px}
.vet{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:14.5px}
.vet caption{text-align:left;font-weight:700;color:var(--suave);padding-bottom:6px}
.vet th{text-align:left;font-weight:500;padding:4px 8px 4px 0;white-space:nowrap}
.vet td{padding:4px 0}
.vet .mini{display:block;height:8px;border-radius:5px;background:var(--azul-claro);overflow:hidden}
.vet .mini i{display:block;height:100%;background:var(--azul-medio)}
.vet .num{text-align:right;font-weight:700;padding-left:8px;width:44px}

/* ---------- movimento reduzido e impressão ---------- */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .gr i{transform:none}
}
@media print{
  @page{margin:12mm}
  body{background:#fff}
  .dock,.acoes-res,.barras,dialog{display:none!important}
  .topo{position:static;background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
  main{padding-bottom:0}
  .hero,.cartao,details.area{break-inside:avoid}
  .qr-texto pre{white-space:pre-wrap}
  body{font-size:13.5px;line-height:1.4}
  main{max-width:none;padding:6px 0 0}
  .topo-in{max-width:none;padding:0 0 8px}
  .hero{padding:16px}
  .hero h1{font-size:28px}
  h2{font-size:17px}
  .cartao{padding:14px 14px 8px;margin-bottom:12px}
  .radar{max-width:400px;margin-left:auto;margin-right:auto}
  .qr-img{width:180px}
  .nota,.curso,.legenda{font-size:12px}
  .chev{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <img class="logo-mini" data-logo alt="Logo do curso de Ciência de Dados e Inteligência Artificial, UTFPR Campus Londrina">
    <div class="identidade"><b>Árvore de Decisão</b><span>Curso de Ciência de Dados e IA, UTFPR Londrina</span></div>
    <div class="barras" id="barras" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
</header>

<main id="tela" tabindex="-1"></main>

<div class="dock" id="dock">
  <div class="dock-in">
    <p class="dock-msg" id="msg" role="alert"></p>
    <div class="acoes" id="acoes"></div>
    <button type="button" class="faixa" id="faixa" aria-haspopup="dialog">
      <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 19v-6M10 19V8M15 19v-4M20 19V5" fill="none" stroke="#14298F" stroke-width="3" stroke-linecap="round"/></svg></span>
      <span><strong>O que Dados e IA têm a ver com isso?</strong><small>Toque para entender como o teste funciona</small></span>
    </button>
  </div>
</div>

<dialog id="folha" aria-labelledby="folhaTitulo2">
  <div class="folha-topo">
    <img class="logo-mini" data-logo alt="Logo do curso de Ciência de Dados e Inteligência Artificial, UTFPR Campus Londrina">
    <div><p>Como este teste funciona</p><h2 id="folhaTitulo">Ciência de Dados e IA por trás deste teste</h2></div>
  </div>
  <div class="folha-corpo"><h3 id="folhaTitulo2"></h3><div id="folhaCorpo"></div></div>
  <div class="folha-pe"><button type="button" class="btn-primario" id="folhaFechar">Entendi, voltar ao teste</button></div>
</dialog>

/* Quanto cada etapa pesa no perfil final (soma = 1) */
const PESOS = { interesses: .45, habilidades: .40, valores: .15 };

/* ---------------------------------------------------------------------
   CÁLCULO
   1) cada etapa vira um vetor de 6 números (um por tipo RIASEC);
   2) cada vetor é normalizado (o maior valor vira 1);
   3) os três vetores são combinados com os PESOS => vetor de perfil;
      os 3 tipos mais altos formam o código RIASEC da pessoa (ex.: IRC);
   4) o perfil é comparado com o vetor de CADA CURSO (similaridade do cosseno,
      depois de descontar a média);
   5) a nota da área é a média dos CURSOS_POR_AREA cursos mais parecidos.
   O percentual é um índice de afinidade, NÃO uma probabilidade de sucesso.
   --------------------------------------------------------------------- */
function somaPesos(lista) {
  return IDS.map(function (d) { return lista.reduce(function (s, it) { return s + (it.p[d] || 0); }, 0); });
}
const TOT_I = somaPesos(INTERESSES);
const TOT_H = somaPesos(HABILIDADES);

function escalar(v) {
  const m = Math.max.apply(null, v);
  return m > 0 ? v.map(function (x) { return x / m; }) : v.map(function () { return 0; });
}
function vetInteresses(sel) {
  return IDS.map(function (d, i) {
    if (!TOT_I[i]) return 0;
    return INTERESSES.reduce(function (s, it) { return s + (sel.has(it.id) ? (it.p[d] || 0) : 0); }, 0) / TOT_I[i];
  });
}
function vetHabilidades(resp) {
  return IDS.map(function (d, i) {
    if (!TOT_H[i]) return 0;
    return HABILIDADES.reduce(function (s, it) {
      const nota = resp[it.id];
      return s + (nota ? ((nota - 1) / 4) * (it.p[d] || 0) : 0);
    }, 0) / TOT_H[i];
  });
}
function vetValores(sel) {
  return IDS.map(function (d) {
    return VALORES.reduce(function (s, it) { return s + (sel.has(it.id) ? (it.p[d] || 0) : 0); }, 0);
  });
}
function perfil(e) {
  const I = escalar(vetInteresses(e.interesses));
  const H = escalar(vetHabilidades(e.habil));
  const V = escalar(vetValores(e.valores));
  const P = IDS.map(function (_, i) {
    return PESOS.interesses * I[i] + PESOS.habilidades * H[i] + PESOS.valores * V[i];
  });
  return { I: I, H: H, V: V, P: P };
}
/* Os 3 tipos mais fortes do perfil (código RIASEC da pessoa). Empate: ordem do hexágono. */
function codigoRiasec(P) {
  return DIMS.map(function (d, i) { return { d: d, v: P[i], i: i }; })
    .sort(function (a, b) { return (b.v - a.v) || (a.i - b.i); })
    .slice(0, 3);
}
function centrar(v) {
  const m = v.reduce(function (a, b) { return a + b; }, 0) / v.length;
  return v.map(function (x) { return x - m; });
}
function cosseno(a, b) {
  let d = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
  return (na < 1e-9 || nb < 1e-9) ? null : d / Math.sqrt(na * nb);
}
function classificar(P) {
  const cp = centrar(P);
  const uniforme = cosseno(cp, cp) === null;   // perfil totalmente "reto": nada se destaca
  const pct = function (c) { return uniforme ? 50 : Math.round(Math.max(0, c) * 100); };
  const porCurso = CURSOS.map(function (c) {
    const cc = cosseno(cp, centrar(c.vet));
    return { curso: c, c: cc === null ? 0 : cc, pct: 0 };
  });
  porCurso.forEach(function (x) { x.pct = pct(x.c); });
  const lista = AREAS.map(function (a) {
    const cursos = porCurso.filter(function (x) { return x.curso.area === a.id; }).sort(function (x, y) { return y.c - x.c; });
    const melhores = cursos.slice(0, CURSOS_POR_AREA);
    const m = melhores.reduce(function (s, x) { return s + x.c; }, 0) / Math.max(1, melhores.length);
    a._cursoPcts = {}; cursos.forEach(function (x) { a._cursoPcts[x.curso.id] = x.pct; });
    a._cursoRank = cursos.map(function (x) { return x.curso; });
    return { area: a, c: m, pct: pct(m), cursos: cursos };
  }).sort(function (x, y) { return y.c - x.c; });
  return { lista: lista, uniforme: uniforme };
}

if (typeof module !== 'undefined') {
  module.exports = { DIMS, AREAS, CURSOS, CURSOS_UTFPR, INTERESSES, HABILIDADES, VALORES, PESOS, PESOS_CODIGO, perfil, classificar, codigoRiasec };

      const ancora = c > 0.3 ? 'start' : (c < -0.3 ? 'end' : 'middle');

    const tres = codigoRiasec(r.P);
    const codigo = tres.map((x) => x.d.id).join('');
    const tambem = lista.slice(1, 3).filter((x) => x.pct >= 30);
    const tambemTxt = tambem.length
      ? `<p class="tambem">Também combinam com o seu perfil: ${tambem.map((x) => `<b>${esc(x.area.nome)}</b> (${pctTxt(x.pct)})`).join(' e ')}.</p>` : '';

    const cursoTop = lista[0].cursos[0];
    const locaisTop = lista[0].cursos.filter((x) => x.curso.tipo === 'utfpr');
    const tagHero = (x) => {
      const local = x.curso.tipo === 'utfpr' && CURSOS_UTFPR[x.curso.utfpr];
      return `<span class="curso${local ? ' local' : ''}">${esc(x.curso.nome)}${local ? `<span class="turno">${esc(CURSOS_UTFPR[x.curso.utfpr].turno)}</span>` : ''}<span class="afin">${x.pct}%</span></span>`;
    };
    const blocoTopo = (tit, l) => `<div class="hero-utfpr"><p class="hero-rot">${tit}</p><div class="cursos">${l.map(tagHero).join('')}</div></div>`;
    const destaqueUtfpr = (cursoTop.curso.tipo === 'utfpr' ? '' : blocoTopo('Curso com maior afinidade nesta área', [cursoTop])) +
      (locaisTop.length
        ? blocoTopo('Na UTFPR Londrina você pode cursar', locaisTop)
        : '<p class="hero-sem">Esta área não tem curso de graduação na UTFPR Londrina. Veja exemplos de outras instituições mais abaixo.</p>');

    const altRadar = 'Gráfico de radar do seu perfil. ' + DIMS.map((d, i) => d.nome + ' ' + Math.round(rel[i] * 100) + '%').join(', ') + '.';

    const linhas = lista.map((x, i) => `
      <details class="area${i < 3 ? ' top' : ''}"${i === 0 ? ' open' : ''}>
        <summary>
          <span class="area-nome">${esc(x.area.nome)}${x.area.cursosUtfpr.length ? '<span class="selo">UTFPR</span>' : ''}${CHEVRON}</span>
          <span class="area-pct">${pctTxt(x.pct)}</span>
          <span class="area-barra"><i style="width:${Math.max(x.pct, 2)}%"></i></span>
        </summary>
        <div class="area-det">
          <p>${esc(x.area.desc)}</p>
          <p class="nota">Perfil RIASEC médio dos cursos da área: <b>${x.area.codigo}</b> (${esc(nomesTipos(x.area.codigo))}).</p>
          ${x.pct < 20 ? '<p class="nota">Esta área combina pouco com o seu perfil de hoje.</p>' : ''}
          ${blocoCursos(x.area)}
        </div>
      </details>`).join('');

    return `
      <section class="hero">
        <p class="peq">Sua maior afinidade é com</p>
        <h1>${esc(A.nome)}</h1>
        <p>${esc(A.desc)}</p>
        <div class="medidor" role="img" aria-label="Afinidade de ${top.pct} por cento"><i style="width:${Math.max(top.pct, 2)}%"></i></div>
        <div class="medidor-txt"><span>Afinidade com o seu perfil</span><b>${pctTxt(top.pct)}</b></div>
        ${destaqueUtfpr}
        ${tambemTxt}
      </section>
      ${equilibrado ? '<div class="aviso">Suas respostas ficaram bem parecidas em todos os tipos, então foi difícil separar as áreas. O ranking abaixo ainda serve de ponto de partida, mas vale refazer marcando só o que mais combina com você.</div>' : ''}
      <section class="cartao">
        <h2>O formato do seu perfil</h2>
        ${radar(rel, relA, altRadar)}
        <div class="legenda">
          <span><i class="chave voce"></i>Você</span>
          <span><i class="chave area"></i>Perfil típico de ${esc(A.nome)}</span>
        </div>
        <p class="nota">Cada ponta é um dos 6 tipos do modelo RIASEC. Quanto mais longe do centro, mais forte é o tipo em você, em relação ao seu ponto mais alto.</p>
        <p><b>Seu código RIASEC: ${codigo}</b></p>
        <ul class="tipos">${tres.map((x) => `<li><b>${esc(x.d.nome)} (${x.d.id}):</b> ${esc(x.d.desc)}.</li>`).join('')}</ul>
      </section>
      <section class="cartao">
        <h2>Áreas e cursos em ordem de afinidade</h2>
        <p class="nota">Toque em uma área para ver os cursos. O selo UTFPR marca áreas com curso no Campus Londrina; esses cursos aparecem em dourado, com o turno. Percentuais baixos não significam que você não serve para a área: só que o seu perfil de hoje é diferente do perfil típico dela.</p>
        ${linhas}
      </section>
      <section class="cartao">
        <h2>Próximos passos</h2>
        <ul class="passos">${proximosPassos()}</ul>
        <p class="nota">Este resultado é uma sugestão baseada só no que você respondeu. Não é diagnóstico nem teste psicológico e não substitui a conversa com um orientador educacional ou psicólogo. Interesses mudam: refaça quando quiser.</p>
      </section>
      ${cartaoQR()}
      <div class="acoes-res">
        <button type="button" class="btn-sec" data-act="imprimir">Imprimir ou salvar em PDF</button>
        <button type="button" class="btn-primario" data-act="refazer">Refazer o teste</button>
      </div>
      ${origem()}`;
  }

  const TELAS = [telaCapa, telaInteresses, telaHabilidades, telaValores, telaPlanos, telaCalculo, telaResultado];

  /* ------------------ FOLHA: Ciência de Dados e IA ------------------ */

  function tabelaVetor() {
    const P = estado.res.P;
    const mx = Math.max.apply(null, P);
    return '<table class="vet"><caption>Seu vetor de perfil (0 a 1, em relação ao seu ponto mais alto)</caption><tbody>' +
      DIMS.map((d, i) => {
        const v = mx > 0 ? P[i] / mx : 0;
        return `<tr><th scope="row">${esc(d.nome)} (${d.id})</th><td><span class="mini"><i style="width:${Math.round(v * 100)}%"></i></span></td><td class="num">${dec(v)}</td></tr>`;
      }).join('') + '</tbody></table>';
  }

  function conteudoFolha() {
    const pc = PESOS_CODIGO.map((n) => String(n).replace('.', ','));
    const pi = Math.round(PESOS.interesses * 100);
    const ph = Math.round(PESOS.habilidades * 100);
    const pv = Math.round(PESOS.valores * 100);
    const vetor = estado.res
      ? tabelaVetor()
      : '<p class="nota">Ao terminar o teste, esta explicação passa a mostrar o seu próprio vetor de perfil.</p>';
    return {
      t: 'Do seu toque ao resultado',
      h: `
        <p>Um teste vocacional é um problema de dados: suas respostas viram números, os números são comparados com o perfil de várias áreas de estudo e o resultado volta em forma de gráfico. Coletar, organizar, analisar e mostrar é ciência de dados.</p>
        <p>Este app nasceu no curso de Ciência de Dados e Inteligência Artificial da UTFPR e funciona sem internet: o cálculo acontece no seu aparelho e nada é enviado para lugar nenhum.</p>
        <p>O modelo usado é o <b>RIASEC</b>, do psicólogo americano John Holland, muito usado em orientação profissional. Ele descreve os interesses em seis tipos: Realista, Investigativo, Artístico, Social, Empreendedor e Convencional. As perguntas do app são originais, e o resultado é uma leitura simples de interesses, não o teste oficial.</p>
        <ol class="passos-dados">
          <li>
            <h4>Suas respostas viram números</h4>
            <p>Cada item que você marca soma pontos principalmente em um dos ${DIMS.length} tipos do modelo e, em alguns casos, um pouco em outro, como a segunda letra de um código de Holland. Juntos, os ${DIMS.length} tipos formam o seu <b>vetor de perfil</b>: uma lista de números que descreve você. Os 3 tipos mais altos formam o seu <b>código RIASEC</b>, por exemplo IRC. Marcar mais itens não dá mais pontos: o que importa é o formato do perfil, não o tamanho dele.</p>
            <div class="termo"><b>Termo de dados:</b> engenharia de atributos, ou seja, transformar respostas em números que um modelo consegue comparar.</div>
          </li>
          <li>
            <h4>As notas de 1 a 5 são normalizadas</h4>
            <p>Essa escala se chama escala Likert. Antes de somar, o app coloca tudo entre 0 e 1, para que perguntas diferentes possam ser comparadas de forma justa. Perguntar sobre o mesmo tema de jeitos diferentes também ajuda a reduzir erros de resposta.</p>
            <div class="termo"><b>Termo de dados:</b> normalização.</div>
          </li>
          <li>
            <h4>Seus valores ajustam os pesos</h4>
            <p>Os valores que você escolhe dão um empurrãozinho no perfil, com peso menor que interesses e habilidades: ${pv}%, contra ${pi}% e ${ph}%. Quem projeta o modelo decide esses pesos, por isso eles precisam ser transparentes e revisados por especialistas.</p>
            <div class="termo"><b>Termo de dados:</b> ponderação.</div>
          </li>
          <li>
            <h4>Nem tudo entra na conta</h4>
            <p>As respostas sobre os seus planos não mudam a pontuação, só personalizam as sugestões. Separar o que pontua do que só dá contexto é uma boa prática em projetos de dados. Também coletamos só o necessário, o que conversa com a LGPD, a lei de proteção de dados pessoais.</p>
          </li>
          <li>
            <h4>Seu perfil é comparado com cada área</h4>
            <p>Cada curso tem um código RIASEC de três letras, como ICR. O app transforma o código em números: a primeira letra vale ${pc[0]}, a segunda ${pc[1]} e a terceira ${pc[2]}. Esses códigos são aproximações, e a equipe do projeto os revisa com orientadores.</p>
            <p>Seu vetor de perfil é comparado com o de cada área usando a <b>similaridade do cosseno</b>: uma conta que mede o quanto dois vetores apontam para a mesma direção. Antes, descontamos a média para comparar só o formato do perfil. O percentual é essa semelhança, a mesma ideia que sites de filmes e músicas usam para recomendar o que você pode gostar.</p>
            <p>A nota de cada área é a média dos ${CURSOS_POR_AREA} cursos dela mais parecidos com você.</p>
            ${vetor}
          </li>
          <li>
            <h4>E a inteligência artificial?</h4>
            <p>Este app usa um modelo transparente, montado por especialistas. Não é uma IA treinada. Com dados anonimizados e autorizados de muitos participantes, técnicas de aprendizado de máquina poderiam agrupar perfis parecidos, ajustar os pesos e medir se as recomendações realmente ajudam.</p>
            <div class="termo"><b>Termo de dados:</b> árvore de decisão é uma técnica clássica de aprendizado de máquina que chega a uma resposta seguindo perguntas encadeadas, como os galhos de uma árvore. É o nome deste app, mas o cálculo aqui é outro: comparar perfis por similaridade. Com dados de muitos participantes, uma árvore de decisão poderia ser treinada para refinar as recomendações.</div>
          </li>
        </ol>
        <div class="termo"><b>Todo modelo erra.</b> Por isso o resultado é uma sugestão para conversar e pesquisar, não um veredito.</div>`
    };
  }

  function abrirFolha() {
    const c = conteudoFolha();
    $('#folhaTitulo2').textContent = c.t;
    $('#folhaCorpo').innerHTML = c.h + origem();
    document.body.style.overflow = 'hidden';
    if (typeof folha.showModal === 'function') { folha.showModal(); } else { folha.setAttribute('open', ''); }
    $('#folhaCorpo').scrollTop = 0;
  }
  function fecharFolha() {
    if (typeof folha.close === 'function') { folha.close(); } else { folha.removeAttribute('open'); }
    document.body.style.overflow = '';
  }

  /* ---------------------------- DOCK / TOPO ---------------------------- */

  function medirDock() {
    document.documentElement.style.setProperty('--dock-h', dock.offsetHeight + 'px');
  }
  function msg(texto) {
    $('#msg').textContent = texto || '';
    $('#msg').style.display = texto ? 'block' : 'none';
    medirDock();
  }
  function atualizarTopo() {
    const p = estado.passo;
    const barras = document.querySelectorAll('#barras i');
    barras.forEach((b, i) => {
      b.className = '';
      if (p >= 5 || (p >= 1 && i < p - 1)) { b.className = 'feito'; }
      else if (p >= 1 && i === p - 1) { b.className = 'atual'; }
    });
    document.title = (p === 0 ? '' : ROTULOS[p] + ' - ') + 'Árvore de Decisão';
  }
  function atualizarDock() {
    const p = estado.passo;
    let h = '';
    if (p === 0) {
      h = '<button type="button" class="btn-primario" data-act="avancar">Começar</button>';
    } else if (p >= 1 && p <= 4) {
      h = '<button type="button" class="btn-sec" data-act="voltar">Voltar</button>' +
          '<button type="button" class="btn-primario" data-act="avancar">' + (p === 4 ? 'Ver meu resultado' : 'Continuar') + '</button>';
    }
    const a = $('#acoes');
    a.innerHTML = h;
    a.style.display = h ? 'flex' : 'none';
  }

  /* ---------------------------- NAVEGAÇÃO ---------------------------- */

  function limparTimers() { estado.timers.forEach(clearTimeout); estado.timers = []; }

  function render() {
    limparTimers();
    view.innerHTML = TELAS[estado.passo]();
    atualizarTopo();
    atualizarDock();
    msg('');
    if (estado.passo === 1) atualizarContInt();
    if (estado.passo === 2) atualizarContHab();
    if (estado.passo === 3) atualizarContVal();
    if (estado.passo === 5) iniciarCalculo();
    window.scrollTo(0, 0);
    try { view.focus({ preventScroll: true }); } catch (e) { /* sem foco */ }
  }

  function ir(p) {
    estado.passo = p;
    if (histOk) {
      try { history.pushState({ p: p }, ''); } catch (e) { histOk = false; }
    }
    render();
  }
  function voltar() {
    if (histOk) { history.back(); return; }
    estado.passo = Math.max(0, estado.passo - 1);
    render();
  }

  window.addEventListener('popstate', (e) => {
    let p = (e.state && typeof e.state.p === 'number') ? e.state.p : 0;
    if (p >= 5 && !estado.res) p = 4;
    if (p === 5) p = 6;
    estado.passo = p;
    render();
  });

  function iniciarCalculo() {
    const msgs = ['Transformando suas respostas em números…', 'Comparando com ' + AREAS.length + ' áreas de estudo…', 'Calculando a afinidade…'];
    if (reduzir) { concluirCalculo(); return; }
    const el = $('#passoCalc');
    estado.timers = [
      setTimeout(() => { el.textContent = msgs[1]; }, 700),
      setTimeout(() => { el.textContent = msgs[2]; }, 1400),
      setTimeout(concluirCalculo, 2100)
    ];
  }
  function concluirCalculo() {
    estado.passo = 6;
    if (histOk) { try { history.replaceState({ p: 6 }, ''); } catch (e) { /* ignora */ } }
    render();
  }

  function calcular() {
    const pf = perfil(estado);
    estado.res = { P: pf.P, rank: classificar(pf.P) };
  }

  function faltamHabilidades() {
    return HABILIDADES.filter((h) => !estado.habil[h.id]).length;
  }

  function avancar() {
    const p = estado.passo;
    if (p === 1 && estado.interesses.size < MIN_INTERESSES) {
      msg('Marque pelo menos ' + MIN_INTERESSES + ' itens para continuar.'); return;
    }
    if (p === 2) {
      const f = faltamHabilidades();
      if (f > 0) {
        msg(f === 1 ? 'Falta 1 frase para responder.' : 'Faltam ' + f + ' frases para responder.');
        const el = document.querySelector('.item:not(.ok)');
        if (el) el.scrollIntoView({ behavior: reduzir ? 'auto' : 'smooth', block: 'center' });
        return;
      }
    }
    if (p === 3 && estado.valores.size < 1) {
      msg('Escolha pelo menos 1 item para continuar.'); return;
    }
    if (p === 4) { calcular(); }
    ir(p + 1);
  }

  function refazer() {
    estado.interesses.clear();
    estado.habil = {};
    estado.valores.clear();
    estado.momento = null;
    estado.tempo = null;
    estado.res = null;
    estado.ordem = sortear();
    ir(0);
  }

  /* ---------------------------- CONTADORES ---------------------------- */

  function atualizarContInt() {
    const n = estado.interesses.size;
    $('#cont').textContent = n === 0 ? 'Nenhum item marcado' : (n === 1 ? '1 item marcado' : n + ' itens marcados');
  }
  function atualizarContHab() {
    const n = HABILIDADES.length - faltamHabilidades();
    $('#cont').textContent = n + ' de ' + HABILIDADES.length + ' respondidas';
  }
  function atualizarContVal() {
    $('#cont').textContent = estado.valores.size + ' de ' + MAX_VALORES + ' escolhidos';
  }

  /* ---------------------------- EVENTOS ---------------------------- */

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.getAttribute('data-act');
    const id = el.getAttribute('data-id');

    if (act === 'avancar') { avancar(); return; }
    if (act === 'voltar') { voltar(); return; }
    if (act === 'refazer') { refazer(); return; }
    if (act === 'imprimir') { window.print(); return; }

    if (act === 'int') {
      if (estado.interesses.has(id)) estado.interesses.delete(id); else estado.interesses.add(id);
      el.setAttribute('aria-pressed', String(estado.interesses.has(id)));
      atualizarContInt(); msg('');
    } else if (act === 'val') {
      if (estado.valores.has(id)) {
        estado.valores.delete(id); msg('');
      } else if (estado.valores.size >= MAX_VALORES) {
        msg('Você já escolheu ' + MAX_VALORES + '. Toque em um deles para desmarcar.'); return;
      } else {
        estado.valores.add(id); msg('');
      }
      el.setAttribute('aria-pressed', String(estado.valores.has(id)));
      atualizarContVal();
    } else if (act === 'nota') {
      const n = parseInt(el.getAttribute('data-n'), 10);
      estado.habil[id] = n;
      const cartao = el.closest('.item');
      cartao.classList.add('ok');
      cartao.querySelectorAll('button').forEach((b) => b.setAttribute('aria-checked', String(b === el)));
      atualizarContHab(); msg('');
    } else if (act === 'momento' || act === 'tempo') {
      estado[act] = (estado[act] === id) ? null : id;
      el.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-checked', String(b.getAttribute('data-id') === estado[act])));
    }
  });

  $('#faixa').addEventListener('click', abrirFolha);
  $('#folhaFechar').addEventListener('click', fecharFolha);
  folha.addEventListener('click', (e) => { if (e.target === folha) fecharFolha(); });
  folha.addEventListener('close', () => { document.body.style.overflow = ''; });
  window.addEventListener('resize', medirDock);

  window.addEventListener('beforeprint', () => {
    document.querySelectorAll('details.area').forEach((d) => { d.setAttribute('data-was', d.open ? '1' : '0'); d.open = d.classList.contains('top'); });
  });
  window.addEventListener('afterprint', () => {
    document.querySelectorAll('details.area').forEach((d) => { d.open = d.getAttribute('data-was') === '1'; });
  });

  /* ---------------------------- INÍCIO ---------------------------- */

  document.querySelectorAll('img[data-logo]').forEach((i) => { i.src = LOGO_URI; });
  try { history.replaceState({ p: 0 }, ''); histOk = true; } catch (e) { histOk = false; }
  render();
})();


</script>
</body>
</html>
